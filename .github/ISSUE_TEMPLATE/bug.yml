name: Bug report
description: Something in Benbow does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Security problems: please do not open an issue, see SECURITY.md."
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Benbow version
      description: Benbow → About Benbow, or `benbow version`.
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: macOS 26.2, MacBook Pro M3
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The site's Logs window, or files from ~/Library/Application Support/benbow/logs/. Remove anything private first.
      render: text
