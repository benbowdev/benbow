version: "2"

run:
  build-tags:
    - integration

linters:
  enable:
    - errorlint
    - gocritic
    - misspell
    - revive
    - unconvert
    - wrapcheck
  settings:
    wrapcheck:
      ignore-package-globs:
        - github.com/getcovo/covo/*
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - wrapcheck

formatters:
  enable:
    - gofmt
    - goimports
